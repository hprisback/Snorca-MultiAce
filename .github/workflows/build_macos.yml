name: Build Snorca for Mac

# Manual builds only. No release publishing and no signing secrets required.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snorca-macos-${{ github.ref }}
  cancel-in-progress: false

env:
  OSX_DEPLOYMENT_TARGET: "12.0"
  CMAKE_PIN: "3.31.6"
  CMAKE_BUILD_PARALLEL_LEVEL: "3"
  BUILD_CONFIG: Release

jobs:
  build:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test MakerWorld links
        run: |
          clang++ -std=c++17 -Wall -Wextra -Isrc tests/slic3rutils/test_makerworld_url_standalone.cpp -o "$RUNNER_TEMP/test-makerworld"
          "$RUNNER_TEMP/test-makerworld"
          clang++ -std=c++17 -Wall -Wextra -Isrc tests/slic3rutils/test_webcam_url_standalone.cpp -o "$RUNNER_TEMP/test-webcam"
          "$RUNNER_TEMP/test-webcam"
      # Follow the verified FOrca macOS recipe: Homebrew zstd conflicts
      # with the vendored headers, so hide it before cache compression detection.
      # Unlink (not uninstall): Homebrew's curl/libcurl, used by brew and git,
      # load libzstd from the opt prefix, which `brew unlink` keeps in place.
      - name: Prepare build tools
        run: |
          brew install ninja automake autoconf libtool texinfo gettext ccache
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          CMAKE_TGZ="cmake-${CMAKE_PIN}-macos-universal.tar.gz"
          /usr/bin/curl --fail --location --retry 3 \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_PIN}/${CMAKE_TGZ}" \
            -o "$RUNNER_TEMP/cmake.tar.gz" ||
          /usr/bin/curl --fail --location --retry 3 \
            "https://cmake.org/files/v3.31/${CMAKE_TGZ}" \
            -o "$RUNNER_TEMP/cmake.tar.gz"
          tar -xzf "$RUNNER_TEMP/cmake.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cmake-${CMAKE_PIN}-macos-universal/CMake.app/Contents/bin" >> "$GITHUB_PATH"
          brew unlink zstd || true

      - name: Compute dependency cache key
        id: depkey
        run: echo "hash=${{ hashFiles('deps/**/CMakeLists.txt', 'deps/**/*.cmake', 'deps/**/*.patch', '!deps/build/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: deps/build/${{ matrix.arch }}/OrcaSlicer_dep
          key: snorca-macos15-v1-${{ matrix.arch }}-${{ env.OSX_DEPLOYMENT_TARGET }}-${{ env.CMAKE_PIN }}-${{ steps.depkey.outputs.hash }}

      - name: Build dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          cmake --version
          msgfmt --version
          bash build_release_macos.sh -d -a "$TARGET_ARCH" -t "$OSX_DEPLOYMENT_TARGET" -T

      - name: Save dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps/build/${{ matrix.arch }}/OrcaSlicer_dep
          key: ${{ steps.deps.outputs.cache-primary-key }}

      # Compiler cache: each run starts on a fresh machine, so without this
      # every source file is recompiled. Only changed files rebuild with it.
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: snorca-ccache-v1-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: snorca-ccache-v1-${{ matrix.arch }}-

      - name: Build slicer
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 3G
          # Needed for precompiled headers (SLIC3R_PCH) to be cacheable.
          CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
          CFLAGS: -Xclang -fno-pch-timestamp
          CXXFLAGS: -Xclang -fno-pch-timestamp
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CMAKE_OBJC_COMPILER_LAUNCHER: ccache
          CMAKE_OBJCXX_COMPILER_LAUNCHER: ccache
        run: |
          ccache --zero-stats
          bash build_release_macos.sh -s -x -a "$TARGET_ARCH" -t "$OSX_DEPLOYMENT_TARGET" -T
          ccache --show-stats

      # Saved even when a later step fails, so the next run keeps the progress.
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: snorca-ccache-v1-${{ matrix.arch }}-${{ github.run_id }}

      - name: Validate and package installer
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: bash scripts/package_snorca_macos.sh "$TARGET_ARCH"

      - name: Smoke test native executable
        run: |
          python3 - <<'PY'
          import subprocess
          result = subprocess.run(
              ["dist/staging/Snorca MultiAce.app/Contents/MacOS/FOrcaSlicer", "--help"],
              timeout=90, capture_output=True, text=True)
          print(result.stdout)
          print(result.stderr)
          if result.returncode:
              raise SystemExit(result.returncode)
          PY

      - name: Upload Mac installer
        uses: actions/upload-artifact@v4
        with:
          name: Snorca-MultiAce-macOS-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.sha256
            dist/BUILD-INFO.txt
            dist/bundle-audit.txt
          if-no-files-found: error
          retention-days: 30
